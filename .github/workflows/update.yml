name: Rebuild standings

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "template.html"
      - "content/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the page
        run: python3 scripts/build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to index.html — nothing to publish."
            exit 0
          fi
          git config user.name  "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild standings ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push

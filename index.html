<title>CU Lions NFL Wins League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper:    #EDF2F6;
    --surface:  #F9FBFD;
    --raise:    #FFFFFF;
    --ink:      #101A22;
    --ink-2:    #45565F;
    --muted:    #6C7C86;
    --line:     #D2DEE6;
    --hair:     #E2EAF0;
    --accent:   #0B4A78;
    --accent-soft: #E2EEF6;
    --warm:     #A8501F;
    --grid:     #E0E8EE;
    /* Columbia blue, used as the banner ground rather than as an accent —
       it is far too light to carry text or marks on a pale page. */
    --band-1:   #BFDDEE;
    --band-2:   #8AC4E2;
    --band-ink: #08243B;
    --band-sub: #2C5975;
    --band-rule: rgba(8,36,59,0.16);
    --scrim-strong: rgba(226,238,246,0.93);
    --scrim-soft:   rgba(226,238,246,0.55);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;

    --f-display: "Oswald", "Haettenschweiler", "Arial Narrow", sans-serif;
    --f-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:   #0B1116;
      --surface: #131A20;
      --raise:   #18212A;
      --ink:     #E6EDF2;
      --ink-2:   #AFBFC9;
      --muted:   #85959F;
      --line:    #26313A;
      --hair:    #1F2831;
      --accent:  #6FB6E8;
      --accent-soft: #14293A;
      --warm:    #E08347;
      --grid:    #222C34;
      --band-1:   #123049;
      --band-2:   #0A1E30;
      --band-ink: #DCEBF5;
      --band-sub: #8FB4CC;
      --band-rule: rgba(220,235,245,0.18);
      --scrim-strong: rgba(7,16,24,0.90);
      --scrim-soft:   rgba(7,16,24,0.45);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:   #0B1116;
    --surface: #131A20;
    --raise:   #18212A;
    --ink:     #E6EDF2;
    --ink-2:   #AFBFC9;
    --muted:   #85959F;
    --line:    #26313A;
    --hair:    #1F2831;
    --accent:  #6FB6E8;
    --accent-soft: #14293A;
    --warm:    #E08347;
    --grid:    #222C34;
    --band-1:   #123049;
    --band-2:   #0A1E30;
    --band-ink: #DCEBF5;
    --band-sub: #8FB4CC;
    --band-rule: rgba(220,235,245,0.18);
    --scrim-strong: rgba(7,16,24,0.90);
    --scrim-soft:   rgba(7,16,24,0.45);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 64px; }

  /* ---------- banner ---------- */
  .banner {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    background: linear-gradient(128deg, var(--band-1) 0%, var(--band-2) 100%);
    color: var(--band-ink);
    padding: 20px 26px 18px;
    isolation: isolate;
  }
  /* Chalked yard lines, angled across the ground — masked so they fade out
     behind the centred type and stay put near the edges. */
  .banner::before {
    content: "";
    position: absolute;
    inset: -20% -10%;
    z-index: -1;
    background: repeating-linear-gradient(
      74deg,
      transparent 0 46px,
      var(--band-rule) 46px 47px,
      transparent 47px 94px
    );
    opacity: .5;
    -webkit-mask-image: radial-gradient(ellipse 62% 68% at 50% 48%, transparent 34%, #000 80%);
    mask-image: radial-gradient(ellipse 62% 68% at 50% 48%, transparent 34%, #000 80%);
  }
  /* Photo ground. Sits under the scrim so the type stays readable whatever
     the image is; hidden until an image is supplied. */
  .banner-photo {
    position: absolute;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center 38%;
    background-repeat: no-repeat;
  }
  .banner-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    /* Strongest where the centred type sits, easing off at the edges. */
    background: radial-gradient(ellipse 82% 92% at 50% 50%,
      var(--scrim-strong) 0%,
      var(--scrim-strong) 46%,
      var(--scrim-soft) 100%);
  }
  /* Masthead: a wordmark and the three facts that change. Everything that
     used to live up here — the format, the scoring, the standing joke about
     who you have to blame — is static text that nobody in an eight-man league
     needs read back to them every Sunday, so it moved to the footer and the
     page now opens on the numbers. */
  .banner-body {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px 28px;
  }
  .eyebrow {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--band-sub);
    margin: 0 0 2px;
  }
  h1 {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: clamp(27px, 4.4vw, 40px);
    line-height: 1.0;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 0;
    text-wrap: balance;
  }
  .meta {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin: 0;
  }
  .meta > div {
    padding: 0 0 0 18px;
    margin-left: 18px;
    text-align: left;
    border-left: 1px solid var(--band-rule);
  }
  .meta > div:first-child { padding-left: 0; margin-left: 0; border-left: 0; }
  .wordmark { flex: 0 1 auto; }
  .meta dt {
    font-family: var(--f-display);
    font-size: 9.5px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--band-sub);
    margin: 0 0 2px;
  }
  .meta dd {
    margin: 0;
    font-family: var(--f-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--band-ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .live { color: var(--band-ink); }
  @media (max-width: 860px) {
    .banner-body { align-items: flex-start; }
    .meta > div { padding-left: 14px; margin-left: 14px; }
  }
  /* Below this the three status items cannot share a line without colliding,
     so they stop being columns and become rows under a rule. */
  @media (max-width: 620px) {
    .banner { padding: 18px 16px 16px; }
    .banner-body { display: block; }
    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--band-rule);
    }
    .meta > div {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0;
      margin: 0;
      border-left: 0;
    }
    .meta dt { margin: 0; }
  }

  /* On the clock. Appears only while the current week still has a game in it,
     so the one thing anybody is waiting on is the first thing under the
     masthead instead of being buried in a slate near the footer. */
  #onclock {
    margin-top: 26px;
    padding: 14px 18px 16px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 3px 3px 0;
  }
  .oc-label {
    margin: 0 0 9px;
    font-family: var(--f-display);
    font-size: 10.5px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .oc-body { display: grid; gap: 10px; }
  .oc-game {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .oc-side { display: inline-flex; align-items: center; gap: 7px; }
  .oc-side b {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: .05em;
  }
  .oc-side em { font-style: normal; font-size: 13px; color: var(--ink-2); }
  .oc-at { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
  .oc-when {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 13px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .oc-stake {
    flex: 1 1 100%;
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-2);
  }
  @media (max-width: 560px) {
    .oc-when { margin-left: 0; flex: 1 1 100%; }
  }

  /* ---------- section ---------- */
  section { margin-top: 44px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  h2 {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin: 0;
  }
  .sec-note { font-size: 13px; color: var(--muted); }

  /* ---------- the story ----------
     The editorial layer: one thesis sentence for the week, then the few
     threads worth knowing. Beats carry a rule in the owner's colour rather
     than a box, so this reads as a column and not as another card deck. */
  #story-sec { margin-top: 34px; position: relative; }
  /* Celebration layer. Switched on only when story.json asks for it, so the
     page goes back to normal next week by deleting one key. It sits behind the
     type, never takes a click, and stops on its own rather than burning a
     laptop battery for as long as the tab is open. */
  #fx {
    position: absolute;
    inset: -18px -10px auto;
    height: 340px;
    width: calc(100% + 20px);
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #fx.lit { opacity: 1; }
  #story-sec .sec-head,
  #story-sec .standfirst,
  #story-sec .beats { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: reduce) { #fx { display: none; } }
  .standfirst {
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(19px, 2.5vw, 23px);
    line-height: 1.34;
    letter-spacing: .005em;
    color: var(--ink);
    margin: 0 0 20px;
    max-width: 46ch;
    text-wrap: pretty;
  }
  /* Column count is set from the number of beats, so a row is never left
     with one orphan sitting beside empty space. */
  .beats {
    display: grid;
    grid-template-columns: repeat(var(--beat-cols, 2), minmax(0, 1fr));
    gap: 18px 22px;
  }
  @media (max-width: 880px) { .beats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 580px) { .beats { grid-template-columns: 1fr; } }
  .beat {
    border-left: 3px solid var(--muted);
    padding-left: 13px;
  }
  .beat-tag {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .beat p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.52;
    color: var(--ink-2);
    text-wrap: pretty;
  }

  /* ---------- standings ---------- */
  .cols {
    display: grid;
    grid-template-columns: 34px 1fr 74px;
    gap: 12px;
    padding: 0 14px 6px;
    font-family: var(--f-display);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .cols span:last-child { text-align: right; }

  .row {
    display: grid;
    grid-template-columns: 34px 1fr 74px;
    gap: 4px 12px;
    align-items: start;
    padding: 14px;
    border-bottom: 1px solid var(--hair);
    border-left: 3px solid transparent;
  }
  .row.me {
    background: var(--surface);
    border-left-color: var(--accent);
  }
  .rank {
    font-family: var(--f-mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 2px;
  }
  /* Podium: only the top three are lifted, so rank reads at a glance. */
  .rank.podium {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .rank.podium.p1 {
    background: var(--accent);
    color: var(--raise);
    border-color: var(--accent);
  }
  .rank.podium.p3 { opacity: .72; }

  .move {
    font-family: var(--f-mono);
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--muted);
  }
  .move.up { color: #0ca30c; }
  .move.down { color: #d03b3b; }

  /* Heat check: how the owner's last completed week compared with the league
     average for that week. Glyph + word carry it, so it never relies on colour. */
  .heat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--f-display);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .13em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid currentColor;
    color: var(--muted);
    white-space: nowrap;
  }
  .heat.hot  { color: #0b8a3e; }
  .heat.cold { color: #c0392f; }
  .heat b { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0; }

  /* Week record. Plain "3/4" needs no legend, so it leads the row and the
     comparative chip follows it. */
  .wk {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    font-family: var(--f-display);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .13em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: var(--raise);
    color: var(--muted);
    white-space: nowrap;
  }
  .wk b {
    font-family: var(--f-mono);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .wk.sweep { border-color: var(--heat-hot); color: var(--heat-hot); }
  .wk.sweep b { color: var(--heat-hot); }
  .wk.blank { border-color: var(--line); color: var(--muted); }
  .wk.blank b { color: var(--muted); }
  .who { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 0 0 2px var(--paper);
  }
  .row.me .dot { box-shadow: 0 0 0 2px var(--surface); }
  .name {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 21px;
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .pill {
    font-family: var(--f-display);
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    color: var(--warm);
    border: 1px solid currentColor;
  }
  .pill.mine { color: var(--accent); }
  .pts {
    grid-column: 3;
    grid-row: 1;
    text-align: right;
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .pts b {
    display: block;
    font-weight: 600;
    font-size: 23px;
    letter-spacing: -0.02em;
  }
  .pts span {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
  }
  .pts span.gained { color: var(--accent); }

  .trend {
    grid-column: 2 / 4;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 2px;
  }
  .trend .bar { flex: 1 1 auto; margin: 0; }

  .bar {
    grid-column: 2 / 4;
    display: flex;
    gap: 2px;
    height: 9px;
    margin: 8px 0 2px;
    background: var(--track);
    border-radius: 1px;
    overflow: hidden;
  }
  .bar .seg {
    border-radius: 1px;
    flex: 0 0 auto;
    min-width: 0;
  }
  :root { --heat-hot: #0b8a3e; --heat-cold: #c0392f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --heat-hot: #45c07a; --heat-cold: #ef6b5e; } }
  :root[data-theme="dark"] { --heat-hot: #45c07a; --heat-cold: #ef6b5e; }
  .heat.hot  { color: var(--heat-hot); }
  .heat.cold { color: var(--heat-cold); }

  :root { --track: #E1E9EF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --track: #212A32; } }
  :root[data-theme="dark"] { --track: #212A32; }

  .teams {
    grid-column: 2 / 4;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 6px;
    margin-top: 8px;
  }
  .chip {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 8px;
    border: 1px solid var(--hair);
    border-radius: 2px;
    background: var(--raise);
  }
  .chip b {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .07em;
  }
  .chip span {
    font-family: var(--f-mono);
    font-size: 12.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .chip.hot { border-color: var(--accent); }

  .whoami {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 3px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .whoami span.lbl {
    font-family: var(--f-display);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }
  .whoami button {
    font: inherit;
    font-family: var(--f-display);
    font-size: 12.5px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--raise);
    border: 1px solid var(--hair);
    border-radius: 2px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .whoami button:hover { border-color: var(--muted); color: var(--ink); }
  .whoami button[aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .whoami button.clear { border-style: dashed; }

  /* ---------- chart ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 18px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .legend i { width: 11px; height: 3px; border-radius: 2px; display: block; }
  .chart-scroll { overflow-x: auto; }
  svg.chart { display: block; width: 100%; min-width: 520px; height: auto; }
  svg.chart text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  svg.chart text.endlab { font-family: var(--f-display); font-size: 11px; letter-spacing: .04em; fill: var(--ink); text-transform: uppercase; }
  .tip {
    position: absolute;
    pointer-events: none;
    background: var(--raise);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 12.5px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    min-width: 128px;
    z-index: 5;
  }
  .tip h4 {
    margin: 0 0 5px;
    font-family: var(--f-display);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tip div { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
  .tip em { font-style: normal; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .tip i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .tip b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .chart-host { position: relative; }

  /* The chart is the same numbers as the table, drawn. It shares the card but
     sits behind a disclosure so the table — the thing actually read — is not
     pushed off the screen by it. */
  details.chart-view { margin-top: 18px; border-top: 1px solid var(--line); }
  details.chart-view summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0 2px;
    font-family: var(--f-display);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
  }
  details.chart-view summary::-webkit-details-marker { display: none; }
  details.chart-view summary::before {
    content: "▸";
    font-size: 10px;
    line-height: 1;
    transition: transform .15s ease;
  }
  details.chart-view[open] summary::before { transform: rotate(90deg); }
  details.chart-view summary:hover { color: var(--ink); }
  details.chart-view .legend { margin-top: 14px; }
  .tbl-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td {
    padding: 6px 10px;
    text-align: right;
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--hair);
    white-space: nowrap;
  }
  th:first-child, td:first-child {
    text-align: left;
    font-family: var(--f-display);
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  thead th {
    font-family: var(--f-display);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child td { border-bottom: 0; }
  /* Total is the anchor column, so it is ruled off from the weekly run. */
  td.tot, th.tot {
    font-weight: 600;
    color: var(--ink);
    border-right: 1px solid var(--line);
    padding-right: 16px;
  }
  th.tot { color: var(--ink); }
  tbody td.tot { font-size: 14px; }

  /* ---------- slate ---------- */
  .slate { display: grid; gap: 0; }
  .game {
    display: grid;
    grid-template-columns: 160px 1fr auto;
    gap: 14px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--hair);
    align-items: center;
  }
  .odds {
    text-align: right;
    font-family: var(--f-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    line-height: 1.35;
  }
  .odds b { font-weight: 600; color: var(--ink); }
  .odds span { display: block; font-size: 11.5px; color: var(--muted); }
  .odds b.score { font-size: 14.5px; letter-spacing: .01em; }
  .game.played .kick {
    font-family: var(--f-display);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .side.won b { color: var(--ink); }
  .side.lost b { color: var(--muted); font-weight: 400; }
  .side.lost .dot { opacity: .45; }
  .game:last-child { border-bottom: 0; }
  .kick {
    font-family: var(--f-mono);
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tag {
    font-family: var(--f-display);
    font-size: 9.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--warm);
    border: 1px solid currentColor;
    border-radius: 2px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  .vs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .side { display: inline-flex; align-items: center; gap: 7px; }
  .side b {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: .06em;
  }
  .side em {
    font-style: normal;
    font-size: 12.5px;
    color: var(--muted);
  }
  .at { color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
  .story {
    grid-column: 2 / -1;
    margin-top: 5px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 74ch;
  }

  .note {
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    font-size: 13.5px;
    color: var(--ink-2);
    border-radius: 0 2px 2px 0;
  }
  footer {
    margin-top: 48px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted);
  }
  footer code { font-family: var(--f-mono); font-size: 12px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 560px) {
    .row, .cols { grid-template-columns: 26px 1fr 62px; }
    .name { font-size: 18px; }
    .pts { font-size: 20px; }
    .game { grid-template-columns: 1fr; gap: 4px; }
    .odds { text-align: left; }
    .odds span { display: inline; margin-left: 8px; }
    .story { grid-column: 1 / -1; }
  }
</style>

<script id="payload" type="application/json">
{
 "blurbs": {
  "1:ARI@LAC": "The biggest upset of the week, and it wasn't close: Arizona 26-14 at SoFi. Jacoby Brissett went 27-of-37 for 277, Trey McBride caught nine balls, a blocked punt in the fourth turned it into a two-score game, and the Cardinals snapped a nine-game losing streak in the process. Anthony drafted three underdogs and a prayer, and the prayer got answered. Zach also lost Ladd McConkey to a chest injury, because of course he did.",
  "1:ATL@PIT": "T.J. Watt took one back for a touchdown in the fourth quarter and that was the whole game \u2014 20-13, Jon's Steelers over Brian's Falcons, who were down to their third-string quarterback. Thirteen points from an offense nobody believed in. The board had this pegged.",
  "1:BAL@IND": "Lamar threw for 324, Derrick Henry scored three times, and the Ravens formula worked precisely as advertised. Mark's Baltimore wins 41-23 on the road, Patrick's Colts open with a beating, and Mark is now three-for-three on the season.",
  "1:BUF@HOU": "Josh Allen: 324 yards, four touchdowns, two of them with his legs, and a 34-yard dagger to Joshua Palmer to take the lead late. Harrison's Texans had this one and gave it away \u2014 Stroud lost two fumbles, the last on a strip-sack with nine seconds showing, and Houston dropped the interception that would have ended it. Jon's on the board. Harrison is 0-for-the-week before his late games even kick.",
  "1:CHI@CAR": "Ninety-six points \u2014 the highest-scoring season opener in NFL history \u2014 and Mark's Bears needed most of them, 59-37. Caleb Williams scrambled in two touchdowns himself; Bryce Young answered with 361 yards and four scores and lost anyway, which tells you how much defense bothered to attend. Patrick drafted the losing side of the wildest game of the day, and it was only the first act of his afternoon.",
  "1:CLE@JAX": "Jacksonville led 24-0 at halftime and the second half was paperwork. Trevor Lawrence went 18-of-23 with four touchdowns for Brian's Jaguars; Deshaun Watson threw a pick and Patrick's Browns never got near it. That's three of Patrick's four teams beaten before the late window even started.",
  "1:DAL@NYG": "Bill's second civil war, and the Giants took it 28-20. Jaxson Dart went 23-of-29 for 230 with three touchdowns and 54 more on the ground in the sort of debut that gets a city excited; Dak threw a pick and was ordinary. Bill banks the point he was always getting, and the NFC East has a new argument going.",
  "1:DEN@KC": "Mahomes came back from a torn ACL and needed one night to settle the question: three total touchdowns, one of them on his own legs. Kenneth Walker III did the actual labor in his Kansas City debut, 173 yards on the ground. Bo Nix fumbled three times, Denver managed 176 total yards \u2014 its worst night under Sean Payton in three years \u2014 and Jon takes the last point of Week 1 to pull level with Anthony.",
  "1:GB@MIN": "Harrison's only favorite of the week delivered, but not the way anyone drew it up: Kyler Murray took a concussion on a third-quarter scramble, Carson Wentz came in, and Minnesota ran off with it 39-22. Brian Flores blitzed on roughly four of every five snaps until Green Bay's line came apart and Jordan Love handed over a fumble and a pick. Harrison's afternoon salvaged, Zach's ruined.",
  "1:MIA@LV": "Las Vegas never punted until the fourth quarter. Ashton Jeanty piled up 147 scrimmage yards on 29 touches with two touchdown catches, Kirk Cousins threw three scores against the team that let him go in the spring, and Miami went 2-for-10 on third down. 27-13, and Mark finishes the day a perfect four-for-four.",
  "1:NE@SEA": "Super Bowl LX rematch, and Seattle needed its backup to settle it: Sam Darnold went out with a hip injury and Drew Lock brought the Seahawks back to win 13-10 in a game neither offense wanted to claim. Brian banks the season's first point. Harrison's Patriots open 0-1 and get a full week to think it over \u2014 and Darnold's hip is now Brian's problem to monitor.",
  "1:NO@DET": "Patrick's Lions went up 21-0 and then spent three quarters handing it back: four straight New Orleans scoring drives, overtime, and a two-point try that died at the goal line. Detroit survives 31-30. Tyler Shough threw for 410 yards for Brian's Saints, got sacked five times, turned it over three times, and walked out with nothing \u2014 which is a deeply Saints way to lose.",
  "1:NYJ@TEN": "Jon's Titans were the nominal favorite and lost by two scores. Cam Ward went 19-of-32 for 140 yards with nothing given away \u2014 the sort of clean, careful, utterly harmless afternoon that gets you beaten by 13. Anthony's Jets ran for 155 and made it look routine, and Robert Saleh won his Tennessee debut against the franchise that fired him.",
  "1:SF@LA": "The first NFL game ever played in Australia drew 100,021 to the Melbourne Cricket Ground and turned into a 90-minute lecture on jet lag. San Francisco flew over a week early; the Rams landed roughly a day before kickoff and stayed on California time. It showed \u2014 27-7 Niners. Purdy threw three touchdowns, Fred Warner knocked the ball loose, and Zach's Rams got exactly one Kyren Williams run to show for the trip. Mark's on the board. Zach flew 8,000 miles to go 0-1.",
  "1:TB@CIN": "Bill's civil war went Cincinnati's way 33-27, so he banks the point he was always going to bank. The fun part was everything else: the Bengals forced four turnovers, Baker Mayfield lost three fumbles on his own, and Burrow still threw a pick-six in the fourth. One point, no bragging rights, and a headache.",
  "1:WAS@PHI": "Philadelphia 24-22, and Washington's comeback died on a two-point try. Jayden Daniels was 6-of-16 for 43 yards through two quarters and nearly dragged his team back anyway; the Eagles just kept hitting the bigger play \u2014 a 43-yard Goedert catch-and-run, a 42-yard Barkley run. Anthony's third win of the day, Harrison's third loss.",
  "2:CAR@ATL": "Carolina went into Atlanta as the shakier kind of road favorite and left with a 31-point win. Bryce Young went 23-of-36 for 287 and three touchdowns; Atlanta, still on Cooper Rush, got 86 passing yards and two interceptions out of him, and the relief quarterback threw a pick-six on his first pass. Patrick's first comfortable afternoon of the season. Brian's Falcons are 0-2 and have scored 16 points.",
  "2:CIN@HOU": "Cincinnati is the most complete team in Bill's portfolio and it isn't close. Ja'Marr Chase caught two touchdowns, the Bengals sacked Stroud four times and held Houston to 5-of-17 on third down. Harrison's Texans are 0-2 and have now lost two games in two entirely different ways.",
  "2:CLE@TB": "A two-hour weather delay, and then the week's second-biggest upset: Cleveland wins in Tampa. The Browns were heavy underdogs against a Bucs team that lost three fumbles in Week 1, and Todd Bowles is fielding questions this morning. Patrick's second win of the afternoon; Bill's Bucs are 0-2.",
  "2:DET@BUF": "The first game at the new Highmark Stadium, and Josh Allen christened it personally \u2014 a one-yard plunge for the building's first touchdown, five scores in total, three through the air and two on the ground. Buffalo led 27-7 at the half and Detroit's second-half points were arithmetic rather than a threat. Goff was sacked on the opening drive and fumbled twice early; James Cook ran for 135. Jon pulls level with Mark at the top. Patrick's night was over before it started, which at least bought him an early bedtime.",
  "2:GB@NYJ": "Zach's first point of the season, and it took overtime. Green Bay trailed in New York, ripped off 13 unanswered, and survived the Jets in extra time. Anthony's Jets fall to 1-1. Zach is officially on the board.",
  "2:IND@KC": "Sunday night went to overtime. Daniel Jones pushed Kansas City the full distance at Arrowhead before the Chiefs won it 33-30 in extra time. Jon's Chiefs are 2-0 with a blowout and an escape. Patrick's Colts are 0-2, but that was comfortably their best football of the season.",
  "2:JAX@DEN": "Jacksonville arrived on a ten-game regular-season winning streak and left without it. Denver scored twice in the fourth quarter to pull away at altitude, and Bo Nix steadied himself after a three-fumble opener. Anthony's Broncos are 1-1. Brian had almost certainly backed the Jaguars; it did not go well.",
  "2:LV@LAC": "The Chargers fumbled six times. They lost one at the worst possible moment, Justin Herbert threw a game-sealing pick late in the fourth, and Mark's Raiders are 2-0. Zach's Chargers are 0-2, and both losses came at home to teams they were favored to beat.",
  "2:MIA@SF": "The widest line of the week, and San Francisco covered it with room to spare \u2014 35-13, Miami 0-2. Mark's Baltimore and Chicago both lost earlier in the day; the Niners and Raiders are both unbeaten and quietly carrying him.",
  "2:MIN@CHI": "Nine to three. A week after scoring 59, Chicago managed three points in three quarters, Minnesota sacked Caleb Williams four times, and Williams left late with a non-contact hamstring injury. Carson Wentz started for the Vikings and did just enough. Harrison's Vikings are 2-0; Mark lost twice before the late window and now has a hamstring to monitor.",
  "2:NO@BAL": "The biggest upset of the week, and it cost Mark his perfect record. Tyler Shough, who threw for 410 in a Week 1 loss, led a second-half surge in Baltimore; the Saints ran in the go-ahead score in the final minutes and a Julian Blackmon interception closed it. Brian's Saints finally got the result their numbers deserved.",
  "2:NYG@LA": "Stafford threw four touchdowns, Davante Adams had his best night of the season, Aaron Donald played his first game back, and a depleted Giants team never got going \u2014 28-6. Zach picks up his second point and completes the strangest line in the league: all eight owners scored exactly two in Week 2. Bill's Giants are 1-1 and Jaxson Dart had nowhere to throw.",
  "2:PHI@TEN": "Anthony against Jon, head-to-head, and it came down to nine seconds. Cam Ward ran for two touchdowns and had Tennessee in front; Jalen Hurts threw two picks and still found Darius Cooper for the go-ahead score with 0:09 on the clock. Anthony takes the point and Jon's Titans fall to 0-2 in the cruelest available way.",
  "2:PIT@NE": "Jon's Steelers scored three points. Aaron Rodgers went 23-of-39 for 187 with a pick and four sacks, Elijah Ponder returned a strip-sack for a touchdown, and Drake Maye hit four throws of 29 yards or longer. The offense nobody believed in has 23 points in two weeks. Harrison gets his first New England win.",
  "2:SEA@ARI": "Drew Lock is 2-0 as Seattle's starter. The champions went into Arizona and won by 24, and the Cardinals \u2014 a week removed from the upset of Week 1 \u2014 handed back every bit of that goodwill. Brian's cleanest win of the season; Anthony's Cardinals are 1-1.",
  "2:WAS@DAL": "Dallas pulled away by 17, and it may be the least important thing that happened: Jayden Daniels hurt his elbow on the final play of the first half, going for it. Bill's Cowboys are 1-1. Harrison's Commanders are 0-2 and now have a bigger problem than the standings.",
  "3:ARI@SF": "Brock Purdy went 15-of-27 for 297 with four touchdowns and no interceptions, which is the kind of line that wins a game by more than six. Arizona got back into it after a muffed punt and a missed extra point, but San Francisco held on 36-30. Mark's Niners are 3-0 despite the injuries piling up \u2014 Mike Evans and Trent Williams the latest. Anthony's Cardinals are 1-2.",
  "3:ATL@GB": "The team that had scored 16 points in two weeks went to Lambeau and hung 35 on the Packers. Michael Penix Jr. started slowly and then simply handed the ball to his playmakers: Bijan Robinson went over 200 scrimmage yards with two touchdowns, Drake London caught nine for 194, and Atlanta piled up 498 total yards. Green Bay scored first and then watched 27 unanswered go by. Brian's Falcons get their first win and Brian gets his first point of the week; Zach loses at home as the favorite, which is becoming the shape of his season.",
  "3:BAL@DAL": "The fattest total on the board delivered 65 points and a walk-off. With seven seconds left Lamar Jackson found Zay Flowers to move the ball, and Tyler Loop kicked it through as time expired \u2014 34-31 Baltimore. Mark's Ravens get the bounce-back he needed; Bill's Cowboys drop to 1-2 having now lost two one-score games.",
  "3:CAR@CLE": "The one game Patrick could not lose, and it still went to the final possession \u2014 Cleveland 21-18. He banks the point either way, which was the whole idea, but the Browns taking it moves them to 2-1 and leaves Carolina at 1-2. A free point that somehow still cost him something.",
  "3:CIN@PIT": "Aaron Rodgers threw for 292 yards and three touchdowns, and Pittsburgh's defense strip-sacked Joe Burrow in the final minute to end it. Cincinnati gave up 411 yards at seven a play and loses its unbeaten record. Jon's Steelers take down Bill's Bengals 30-27, the third leg of a clean sweep of his morning.",
  "3:HOU@IND": "Spencer Shrader hit a 53-yarder in the closing seconds \u2014 his fourth make of the day, having picked up a knock in warmups \u2014 and Indianapolis finally has a win. Houston is 0-3 to start a season for the second year running. Patrick's second point of the morning; Harrison's Texans have now lost three games three different ways.",
  "3:KC@MIA": "It was 14-10 into the fourth before Travis Kelce sealed it. Miami lost De'Von Achane to a knee injury on the opening drive and is 0-3 with the league's thinnest offense. Jon's Chiefs are 3-0 and have now won a blowout, an overtime game and a grind.",
  "3:LA@DEN": "Talanoa Hufanga decided this one twice. His 66-yard pick-six in the fourth gave Denver its first lead of the night, and his second interception, off Stafford with about forty seconds left, ended it. In between, Bo Nix dived in from short range with 47 seconds on the clock to make it 30-26, on a drive kept alive by a contested pass interference call that wiped out what looked like a Rams interception. Anthony moves to 6. Zach's Rams were favored on the road and he finishes Week 3 on nothing for the second time in three weeks.",
  "3:LAC@BUF": "Josh Allen turned it over on three of Buffalo's first four possessions and won comfortably anyway. Los Angeles managed ten points off those gifts, Allen threw two fourth-quarter touchdowns, James Cook added another, and the Bills are 3-0. Zach's Chargers are 0-3 and have now found three different ways to be in a game and lose it.",
  "3:LV@NO": "Kirk Cousins threw for 248 and three scores without a turnover; Tyler Shough threw four touchdowns and still lost, because he also threw a pick and put the ball on the ground twice. Las Vegas took the mistakes and ran \u2014 35-27 on the road. Mark's Raiders are 3-0 and the least discussed unbeaten team in the league. Brian's Saints fall to 1-2.",
  "3:MIN@TB": "Minnesota's defense did what it has done all season and Tampa Bay never got going: 23-16, Vikings now 3-0. The bigger problem for Bill is the hand \u2014 Baker Mayfield dislocated the thumb on his throwing hand during the loss, and the Buccaneers are 0-3 with no obvious way out. Harrison quietly has his second point of the week.",
  "3:NE@JAX": "Drake Maye was benched in the fourth quarter after 14-of-25 for 199 with two interceptions and a lost fumble. Trevor Lawrence threw three touchdowns at the other end. 35-6, and Brian's Jaguars are 2-1 with the look of a team that has figured something out. Harrison's Patriots are 1-2.",
  "3:NYJ@DET": "Jahmyr Gibbs scored three times after halftime and now has six touchdowns in three weeks. Detroit led 24-10 in the fourth, let the Jets level it on a two-point conversion with four minutes left, and needed Gibbs one more time to put it away. Patrick's Lions cannot stop making their afternoons interesting. Anthony's Jets drop to 1-2.",
  "3:PHI@CHI": "Not Tyson Bagent \u2014 he wasn't cleared from concussion protocol until Sunday \u2014 so Chicago started Case Keenum, and Keenum went 24-of-34 for 247 with two touchdown passes and a third on the ground. The Bears defense took the ball away three times, held Philadelphia to 2-of-9 on third down and 62 yards in the entire second half. Jalen Hurts left in the second quarter for a concussion evaluation. 27-7, and Mark finishes Week 3 four-for-four and two clear at the top. Anthony's unbeaten Eagles were the last team standing and got dismantled by a 38-year-old backup.",
  "3:SEA@WAS": "Marcus Mariota, starting with Jayden Daniels hurt, beat the defending champions. Sam Darnold returned for Seattle and it wasn't enough \u2014 the Seahawks couldn't get off the field on two third-and-longs in the final minute. Harrison steals one 33-31, and Brian's Seahawks are 2-1.",
  "3:TEN@NYG": "Twelve points, seven points, and a nor'easter. Jameis Winston went 14-of-22 for 118 without throwing a pick, which in that weather counts as command, and Bill's Giants are 2-1 under John Harbaugh. Jon's Titans are 0-3 and have scored 37 points all season \u2014 the one hole in an otherwise excellent morning for him.",
  "4:ARI@NYG": "Jacoby Brissett threw three interceptions including a pick-six to end it; Jameis Winston threw two of his own and lost a fumble, and still won by twelve. 36-24. Bill's Giants are 3-1 and look like a real team. Anthony's Cardinals are the second domino of a very bad afternoon.",
  "4:ATL@NO": "Brian's free point arrived as a 45-24 demolition. Bijan Robinson ran for 145 at 7.6 a carry with two scores and Brian Robinson added three more \u2014 only the second time in Atlanta's history two players have each run in multiple touchdowns. Penix went 15-of-20 for 233 and was pressured on three dropbacks all night; Tyler Shough was pressured on nearly half of his. A point either way, and the Falcons have gone from the worst team in the league to this in three weeks.",
  "4:DAL@HOU": "Javonte Williams scored three times and Dak Prescott drove 74 yards in 1:43 to win it. Bill's Cowboys take a shootout 34-30. Harrison's Texans are 0-4 and have now lost two games in the final two minutes \u2014 the most frustrating team in the league to own.",
  "4:DEN@SF": "Brock Purdy threw two touchdowns without an interception for the third straight game and George Kittle took a screen 56 yards with under two minutes left to seal it. Bo Nix went 1-of-9 on throws past ten yards. 24-14, San Francisco 4-0, and Mark's most dependable asset keeps being exactly that. Anthony's fourth and final loss of the day.",
  "4:DET@CAR": "Patrick's guaranteed point went Carolina's way, 32-26, and Tetairoa McMillan had the best game of his career doing it \u2014 Bryce Young found him over and over and the Lions had no answer. A free point either way, and the one he'd have picked.",
  "4:GB@TB": "Jalon Daniels, starting for the injured Baker Mayfield, went 19-of-27 for 148 with two interceptions, and Tampa lost 17-14 to fall to 0-4. Zach's Packers take the second of his two favored games and he banks a real week for the first time. Bill's Buccaneers are the worst team he owns and it isn't close.",
  "4:IND@WAS": "London, and Jonathan Taylor ran for 95 and two scores to take control after a scrappy start. Harrison lost Marcus Mariota to an aggravated MCL and finished with Athan Kaliakmanis, who went 13-of-31 but found two deep touchdowns. Terry McLaurin was already inactive with a hamstring. 30-13 Patrick, who is suddenly collecting these.",
  "4:JAX@CIN": "Joe Burrow threw it 54 times for 428 yards and two interceptions, which is what losing looks like when the line can't hold. Trevor Lawrence needed 23 attempts. Ja'Marr Chase left with a concussion. 22-17 Brian, and Bill's Bengals have now lost two straight after starting 2-0.",
  "4:KC@LV": "The game that was supposed to decide the top, and Jon took it. Kenneth Walker III ran for 175 and two scores including a 76-yarder that turned the third quarter, and Mahomes hit Tyquan Thornton from 55. Kirk Cousins threw for 365 and his three tight ends combined for 200 yards, which was not enough. 30-27, and Mark's Raiders lose their unbeaten record but not his lead.",
  "4:LA@PHI": "Philadelphia led into the last four minutes and then gave up fourteen unanswered. Zach's Rams win 24-20 and his season finally has something in it. Anthony lost Saquon Barkley to a hamstring, Quinyon Mitchell to a knee and Jonathan Greenard to an ankle in the same game \u2014 the Eagles are 2-2 and look nothing like the team that started 2-0.",
  "4:LAC@SEA": "Justin Herbert threw two first-half interceptions and lost a fumble, and is now the first Chargers quarterback since Ryan Leaf in 2000 to have six picks and ten sacks through four games. Uchenna Nwosu's strip-sack inside two minutes ended it. 30-23 Brian, and Zach's Chargers are 0-4 with an injury list that reads like a roster.",
  "4:MIA@MIN": "Minnesota is 4-0 and has not scored a touchdown in two games \u2014 Will Reichard kicked five field goals and has now made 31 in a row. Kyler Murray threw for 247 and Hockenson caught 13. Harrison wins 15-10 and loses Justin Jefferson to an ankle. Zach's Dolphins are 0-4 and still without De'Von Achane.",
  "4:NE@BUF": "Buffalo's first loss, and it stung. Drake Maye threw for 269 and three touchdowns; Josh Allen threw one interception at the wrong moment and Maye hit the completion that ran out the clock. 29-26 New England. Harrison's Patriots are the surprise of the week; Jon drops a game he was favored to win and D.J. Moore left injured.",
  "4:NYJ@CHI": "Kyle Monangai ran for 146 and two scores and Tyson Bagent \u2014 now actually cleared \u2014 went 25-of-34 for 268. The Jets went 0-for-7 on third down and gained 157 yards all afternoon. 23-12. Mark's Bears keep winning with whoever is available; Anthony's Jets were the first of his four to go down.",
  "4:PIT@CLE": "Andre Szmyt from 56 yards with the game on it, and Grant Delpit picked off the Hail Mary to end it. Cleveland led 21-10 into the fourth before Pittsburgh clawed back \u2014 Rodgers found Darnell Washington after a pass interference call, then snuck it in himself for two after Jared Verse jumped offsides. Rodgers finished with 299 yards, three touchdowns, two picks and five sacks from five different Browns. Patrick's Browns are 3-1 with their first three-game winning streak since 2023, and that's now five straight home wins over Jon's Steelers.",
  "4:TEN@BAL": "Mark got the win and may have paid for it: Lamar Jackson hurt his ankle before halftime and did not return. Tyler Huntley came on and went 8-of-9. Baltimore wins 24-18 but covered nothing, and Jon's Titans are 0-4 having again been competitive and again lost.",
  "5:BAL@ATL": "Mark's point, and he had no business getting it. Lamar Jackson was out with the ankle, so Tyler Huntley made his first start of the season and went 24-of-32 for 201 without an interception, closing on eleven straight completions. Atlanta led 23-15 after Nick Folk's fourth field goal with 2:31 left; Baltimore answered in six plays and 71 yards, a seven-yard throw to Devontez Walker, and Derrick Henry running in the two-point conversion out of the wildcat. In overtime the Ravens took the ball first and held it for 14 plays and seven minutes before Huntley sneaked it in. Tua Tagovailoa, on for the injured Michael Penix Jr., threw the interception to Kyle Hamilton that ended it. Baltimore is 4-1 and alone atop the AFC North; Brian's Falcons are 2-3 and gave this one away.",
  "5:BUF@LA": "Jon's point, and the week's best game. Josh Allen went 12-of-19 for 210 and ran ten times for 121, finishing with 331 total yards \u2014 his hundredth career win and his first ever in overtime after seven losses. Matthew Stafford answered with 40-of-54 for 383 and three touchdowns, and Puka Nacua caught 17 of them for 138, a career high and one short of a Rams record that has stood since 1950. James Cook ran for two scores, then fumbled in overtime at the Los Angeles 20. Harrison Mevis had the game on his foot from 48 and Greg Rousseau blocked it; Allen scrambled 19 and 13 and Tyler Bass won it from 45. Buffalo is 4-1, Zach's Rams are 2-3, and D.J. Moore's 91-game streak ended on the inactive list.",
  "5:CHI@GB": "Zach's point, and it was never close. Jordan Love went 25-of-31 for 367 \u2014 the most a Packers quarterback has thrown for against Chicago at Lambeau \u2014 with two touchdowns to Christian Watson, who finished with 143 yards. Green Bay outgained Mark's Bears 130-9 in the first quarter and forced five turnovers, two of them Xavier McKinney interceptions off Tyson Bagent. Caleb Williams missed a third straight game with the hamstring.",
  "5:CIN@MIA": "Bill's point. Joe Burrow went 23-of-32 for 190 with four touchdowns to four different receivers, including a one-handed 45-yarder to Ja'Marr Chase, whose 58 career touchdown catches are the most of anyone who entered the league with him. Jordan Battle intercepted Malik Willis on back-to-back drives in the second quarter. Zach's Dolphins are 0-5; they scored with 45 seconds left, missed the extra point off the upright, and kicked the onside out of bounds.",
  "5:CLE@NYJ": "Anthony's point, built entirely by the defense. The Jets sacked Deshaun Watson eight times \u2014 the most by any team in a game this season \u2014 with rookie David Bailey getting three of them. Braelon Allen ran for 116 and the 22-yard winner on third down with three minutes left. On Patrick's Browns' eighth punt the snap sailed over the punter's head and New York recovered at the 23. Cleveland's three-game run is over.",
  "5:DEN@LAC": "Anthony's point. Denver scored the last 13 while Zach's Chargers handed it over \u2014 Justin Herbert fumbled, then threw an interception, then took a sack on the final play of regulation in Denver territory, and Wil Lutz turned the first two into field goals from 19 and 37. Bo Nix had tied it with a five-yard throw to Courtland Sutton. Los Angeles had 74 yards of offense at halftime and is 0-5. Hayden Rucci, a 25-year-old undrafted tight end who spent two years on the practice squad, caught a touchdown on his first NFL touch.",
  "5:DET@ARI": "Patrick's point and Anthony's beating. Jared Goff was 19-of-30 for 279 with three touchdowns and a one-yard run; he has 12 touchdown passes and no interceptions through five games, which only Russell Wilson in 2019 has ever matched. Jahmyr Gibbs carried 25 times for 151 with two scores \u2014 his 58th career touchdown before his 25th birthday, passing Barry Sanders. Arizona led 7-0, then gave up 31 straight, traded Marvin Harrison Jr. to Houston during the first quarter, and has now lost nine in a row at home.",
  "5:HOU@TEN": "Somebody had to win it, and Harrison got the point. Houston's first victory of the season was a 26-3 walk, C.J. Stroud going 26-of-34 for 260 with a touchdown to Jaylin Noel and a two-yard keeper, Will Anderson Jr. taking three of the four sacks, Ka'imi Fairbairn making four field goals. Jon's Titans are 0-5, have lost eleven straight inside the division, and averaged 3.2 yards a play. Jon came up empty here for the fifth week running.",
  "5:IND@PIT": "Jon's point, Patrick's loss, and the direct collision went to Pittsburgh. Aaron Rodgers, 42 years old, threw three more touchdowns and passed Peyton Manning for third on the career list at 582 including the postseason; his 166 regular-season wins as a starter moved him past Ben Roethlisberger. Jaylen Warren put up 188 yards from scrimmage on 21 touches, with an 80-yard touchdown catch and a 50-yard touchdown run. Spencer Shrader made five field goals for the Colts, which is how a team moves the ball and loses by 12.",
  "5:LV@NE": "Harrison's point, and the week's cleanest quarterback performance. Drake Maye went 26-of-34 for 374 with four touchdown passes and a three-yard run, no turnovers \u2014 the first Patriots quarterback since Tom Brady in 2018 with back-to-back three-touchdown games. New England's 536 yards were a season high and 45 points its most in five years. Mark's Raiders got 110 yards from Brock Bowers and not much else. New England lost left tackle Will Campbell and TreVeyon Henderson to injuries; Fernando Mendoza, the first pick in the draft, debuted once it was decided.",
  "5:MIN@NO": "Harrison's second point of the day, and Minnesota is 5-0. Kyler Murray was 24-of-30 for 229 and ran for 51 more without a turnover, Justin Jefferson came back from the ankle for a leaping 15-yard score, and Aaron Jones carried 25 times for 113 and the go-ahead touchdown. Brian's Saints finished with 142 total yards; their only equalizer was Jonas Sanker returning a fumble 87 yards, and the extra point missed. Drew Brees went into the Ring of Honor at halftime.",
  "5:NYG@WAS": "A tie, and half a point each to Bill and Harrison. Jameis Winston threw for 326 and three scores, Malik Nabers caught 11 for 121, and Isaiah Likely had a career-high 11 catches and two touchdowns. Jayden Daniels, back from a second dislocation of the same elbow, ran for 109 and two more. Then overtime: Daron Payne stripped Cam Skattebo inside field-goal range, and with 12 seconds left and no timeouts Daniels scrambled for nothing and the clock ran out during the spike. Dominic Zvada went 2-of-5 on field goals for the Giants, which is the actual reason this ended even.",
  "5:PHI@JAX": "Brian's point came in London on the last play. Jake Elliott's 48-yarder put Anthony's Eagles up 17-16 with eight seconds left; Ameer Abdullah returned the kickoff 53 yards and Cam Little hit a 57-yard field goal as the clock hit zero. Trevor Lawrence threw for 331 and two touchdowns, both to Parker Washington, one of them one-handed on fourth-and-five. Jacksonville is 4-1 despite 13 penalties for 100 yards; Philadelphia has lost three in a row.",
  "5:SF@SEA": "Mark's only point of the afternoon, and the one Brian will replay. Seven combined turnovers, the most in any game this week, two of them Renardo Green interceptions. Brock Purdy's seven-yard throw to Brandin Cooks plus a two-point conversion to Mike Evans put San Francisco ahead, Seattle tied it, and Eddy Pineiro won it from 43 with 1:56 left. Seattle's last drive died on a third-down drop and a fourth-down stop a yard short. The 49ers are 5-0; Dre Greenlaw was ejected in the second quarter for a headbutt.",
  "5:TB@DAL": "Bill's free point arrived as an upset. Jalon Daniels \u2014 undrafted, making his second career start for the injured Baker Mayfield \u2014 went 19-of-25 and became only the second undrafted quarterback ever to start and beat the Cowboys. Bucky Irving ran for a career-high 165 including a 72-yarder on the first play of the second half. Tampa gained 419 yards, played turnover-free for the first time all season, and got its first win; Dallas committed three turnovers and lost Dak Prescott to a quad injury. Bill takes the point and is up to 8.",
  "6:ARI@LA": "Anthony's point, and the strangest game of the week. Neither team scored a touchdown until Matthew Stafford found Colby Parkinson with 47 seconds left \u2014 awarded on review after being ruled down at the one. Arizona went 0-for-5 in the red zone and won anyway, because Chad Ryland made all six of his field goals and the last one went through as time expired. Zach's Rams lost their kicker in the first quarter when Blake Grupe hurt his knee making a tackle on a kickoff; the punter handled the extra point.",
  "6:BAL@CLE": "Patrick's point, and a Mark loss. Lamar Jackson sat out a second straight week with the ankle, so Tyler Huntley started again and threw for 165. Baltimore led 10-0 in the first quarter and did not score again. Carson Schwesinger forced Derrick Henry's first lost fumble of the season in the fourth, Cleveland turned it into the tying touchdown, and Andre Szmyt won it from 37 as time expired \u2014 his first attempt was blocked and a defensive offside gave him another. Both teams are 4-2 atop the AFC North.",
  "6:BUF@LV": "First against second, head to head, and Jon took it. Josh Allen went 23-of-33 for 255 and tied Jim Kelly's franchise record of 258 career touchdown passes on a backhanded flip to Keon Coleman. Kirk Cousins \u2014 who kept the job over Fernando Mendoza \u2014 threw for 313 and two scores and had Mark level at 23 with eight minutes left. James Cook ran in the go-ahead score, Tyler Bass made it two possessions, Tre Tucker caught a 44-yarder to make it interesting, and Buffalo recovered the onside kick. The Bills are 5-1 and played turnover-free for the first time in a month; Mark's Raiders have lost three straight.",
  "6:CAR@PHI": "Patrick's second point, and Philadelphia has now lost four straight. Jalen Hurts was ruled out after a blood clot was found in his leg, so Tanner McKee started and went 26-of-45 for 215. Chuba Hubbard carried 28 times for 120 and a score, including nineteen yards on fourth-and-one to build the lead. Carolina gained 399 yards. Anthony's Eagles rushed for 35.",
  "6:CHI@ATL": "Mark's only point of the week. Caleb Williams, back from the hamstring, went 30-of-36 for 305 and was 24-of-24 from a clean pocket. Kyler Gordon, also back from injury, had three sacks. Michael Penix Jr. was sacked five times and fumbled late, and Zachariah Branch muffed a punt and lost a kickoff. Chicago led 14-0 after a quarter, committed twelve penalties for 133 yards, and won anyway. Brian's Falcons are 2-4.",
  "6:DAL@GB": "Zach's point, and his first of the week. Green Bay led wire to wire and converted its first seven third downs \u2014 a team record going back at least to 1978 \u2014 after entering as the league's worst third-down offense. Jordan Love went 23-of-41 for 276 with a touchdown to Matthew Golden and a one-yard sneak; Dak Prescott threw interceptions on back-to-back second-quarter drives, both inside the Green Bay 30, and Dallas was scoreless in a first half for the first time since 2021. Micah Parsons still has not played a game for Bill's Cowboys this season; Kenny Clark, who went the other way in that trade, got his first sack of the year at Lambeau. CeeDee Lamb passed Tony Hill for third on the Dallas receiving list. Green Bay is 4-2 and has won three straight; Dallas is 2-4.",
  "6:HOU@JAX": "Harrison's point, decided at Wembley as time expired. C.J. Stroud threw for 312 and three scores, Trevor Lawrence answered with 306 and four, and Cam Little tied it from sixty with two minutes left. Then Houston drove and Ka'imi Fairbairn won it from 49 on the last play. Travis Hunter played both ways for Brian's Jaguars \u2014 eight catches, 101 yards, a touchdown, and an end-zone interception of Stroud \u2014 and it was not enough. Marvin Harrison Jr. made his Texans debut.",
  "6:LAC@KC": "Jon's third point of the afternoon and the least surprising. Kansas City led 19-3 at halftime and is 5-0. Kenneth Walker III ran nineteen times for 128 and two scores. Justin Herbert did not throw a touchdown pass for the first time this season, was sacked four times, and led Zach's Chargers in rushing with 26 yards; Los Angeles is 0-6. Patrick Mahomes threw for 272 without a touchdown of his own, and Harrison Butker missed an extra point and a field goal, which is the only thing that kept the number respectable.",
  "6:NO@NYG": "Brian's point, and it took thirty-four unanswered. Tyler Shough threw four touchdowns without an interception, Bryce Lance caught his first career score on fourth down, and New Orleans forced four turnovers with five sacks \u2014 Martin Emerson had two interceptions. Bill's Giants benched Jameis Winston for J.J. McCarthy with 11:25 left after two picks; McCarthy threw for 243 and nearly got them back. New York is 3-2-1.",
  "6:NYJ@NE": "Harrison's second point. Drake Maye threw three touchdowns and was 6-of-10 for 87 with two scores on third down; New England gained 383 yards and is 4-2. Anthony's Jets went 3-of-10 on third down, 0-for-2 on fourth and 0-for-3 in the red zone, and Geno Smith threw his first interception of the season. A.J. Brown came back from injured reserve for the Patriots. New England lost three offensive linemen during the game.",
  "6:PIT@TB": "Jon's point, and he had to wait for it. Tampa Bay led 16-3 on Bill's watch before Chris Boswell started making everything \u2014 52, 39, a 58-yarder to tie it before the two-minute warning and a 20-yarder with 1:21 left \u2014 and Chase McLaughlin answered from 53 to force overtime. Pittsburgh then drove 6:45 and Aaron Rodgers threw a six-yard screen to Germie Bernard, who finished with eleven catches. Jalen Ramsey sacked Jalon Daniels on fourth-and-eight to end it. Baker Mayfield sat with the thumb; Bill's Buccaneers are 1-5.",
  "6:SEA@DEN": "Thursday night went to overtime and Anthony took it. Seattle outgained Denver 353-168 and lost anyway \u2014 Sam Darnold threw a career-high 51 times for 278 yards and two interceptions, the second to Ja'Quan McMillian in the extra period, and Wil Lutz ended it from 53. Brian's Seahawks had scored eleven in the last six minutes to force it, including a tipped two-point catch by Rashid Shaheed. Denver is 4-2 and 4-0 in one-score games.",
  "6:TEN@IND": "THE TITANS WON A FOOTBALL GAME. Three hundred and one days since the last one, and they did it from thirteen down at halftime with sixty-four yards of offense. Chimere Dike's 58-yard punt return set up Cam Ward's eight-yard touchdown to Carnell Tate, the rookie's first. Four minutes later Julius Chestnut and James Williams blocked a punt and Femi Oladejo took it fourteen yards in \u2014 Tennessee's first since 2011, the league's first this season. Jonathan Taylor tied it; Joey Slye won it from 49 and iced it from 44, finishing 4-for-4 with a 56-yarder. The defense had six sacks and three takeaways, Jeffery Simmons had two sacks with a forced fumble and the recovery, and Amani Hooker had thirteen tackles and an interception at the six. Robert Saleh's first win, the franchise's 500th, and Patrick's Colts are 2-4.",
  "6:WAS@SF": "Mark's second point of the week and the one that reset the lead. San Francisco led 20-3 at half and held on 23-17. Christian McCaffrey scored twice from a yard out and finished with 117 scrimmage yards; Brock Purdy went 21-of-29 for 264 and a touchdown to George Kittle. Harrison's Commanders got 300 passing yards and two touchdowns from Jayden Daniels, who was sacked four times, and lost Terry McLaurin to a knee injury in the first quarter \u2014 he was carted off. Washington's last chance died on a fourth-down breakup at the 17 and a sack on the final snap. The 49ers are 6-0 and the win was their 56th on Monday night, the most in NFL history. Fred Warner became the first 49er with 1,000 career tackles.",
  "7:CIN@BAL": "Bill's point, and the week's loudest scoreline. Mark's Ravens led 13-0 at halftime and lost 35-13 \u2014 Cincinnati scored thirty-five unanswered on five straight touchdown drives. Joe Burrow went 16-of-18 for 249 with all four of his touchdowns after the break, finishing 22-of-30 for 292. Tee Higgins caught six for 148 and passed 6,000 career yards. Baltimore managed five first downs in the second half, Derrick Henry got 45 yards on 17 carries, and Lamar Jackson missed a third straight game with the ankle. It is Cincinnati's first division win of the season.",
  "7:CLE@TEN": "Patrick's point, and Jon came up empty again. Tennessee led 14-0 and lost 27-24 on a last-second Andre Szmyt field goal. Tony Pollard was the best player on the field in defeat \u2014 25 carries, 129 yards, three touchdowns \u2014 and it was not enough. Deshaun Watson threw for 308 and led the winning drive, his fifth of the season, and Quinshon Judkins ran for 96 and two scores. Cleveland is 5-2; the Titans are 1-6.",
  "7:DAL@PHI": "Monday night, Bill against Anthony, and the last point of Week 7. Dallas is favored by four and a half on the road in a division game \u2014 Anthony's Eagles have lost four straight and scored 58 points doing it, and Tanner McKee starts with Jalen Hurts on injured reserve after blood clots were found in his calf and lungs. Saquon Barkley is questionable but practiced in full on Saturday for the first time since the hamstring; both backups are on injured reserve. Bill's Cowboys have lost two straight with 29 points between them and rank 30th on defense, which is the matchup if Barkley plays. Dallas gets Cobie Durant and DeMarvion Overshown back.",
  "7:DEN@ARI": "Anthony owned both sidelines, so the point was banked before kickoff \u2014 and Denver took it 30-16. Bo Nix threw for 222 and ran 62 yards for a touchdown, the longest quarterback scramble score in the Next Gen Stats era. Nik Bonitto generated thirteen pressures and Alex Singleton made nineteen tackles. Arizona gave up 377 yards and was without rookie running back Jeremiyah Love. Denver is 5-2, the Cardinals 2-5.",
  "7:GB@DET": "Patrick's second point, on a field goal at the whistle. Detroit put up 415 yards and 26 first downs and needed every second of it, having given it away repeatedly \u2014 Jahmyr Gibbs fumbled and a botched snap between Jared Goff and Cade Mays cost them another. Goff threw for 303 and two scores. Zach's Packers lost it on the kicking: Trey Smack missed from 26 and from 35. Jordan Love threw for 274 and two touchdowns with an interception, and Josh Jacobs dropped one in the end zone.",
  "7:IND@MIN": "Harrison's only point, and Minnesota is the last unbeaten team in the league at 6-0. Brian Flores blitzed Daniel Jones on 85 percent of his dropbacks, sacked him four times and shut Patrick's Colts out after halftime; Harrison Smith sealed it with an interception inside two minutes. Jones went 13-of-22 for 108 and Kyler Murray relieved him for eleven throws. Spencer Shrader missed from 56 and 48. Indianapolis is 2-5 and fired its general manager a week ago.",
  "7:KC@SEA": "Brian's point, and Kansas City's first loss. Seattle won 20-3 and Jon's Chiefs never reached the red zone \u2014 the first time that has happened in a Patrick Mahomes start, and only the second full game of his career without a touchdown pass. Mahomes went 19-of-33 for 165 with an interception; Kansas City gained 213 yards and went 3-of-11 on third down. Kenneth Walker III, back in Seattle in a Chiefs uniform, was held to 36 yards on 14 carries. Jaxon Smith-Njigba caught nine for 150 and a 28-yard score \u2014 his sixth hundred-yard game in seven. Harrison Butker missed twice. Travis Kelce played and moved to fifth on the all-time receptions list.",
  "7:LA@LV": "Zach's point, and he got it without his best receiver and on his fourth kicker of the season. Los Angeles led 28-6 at halftime on four straight touchdown drives and won 35-21. Matthew Stafford went 23-of-29 for 195 with three touchdowns and became the Rams' career passing-touchdown leader at 155, passing Roman Gabriel. Kyren Williams and Blake Corum combined for 192 yards on 33 carries. Davante Adams is on injured reserve with a ruptured hamstring, six to ten weeks. Mark's Raiders started Kirk Cousins over Fernando Mendoza, went 3-of-14 on third down and have lost four in a row.",
  "7:MIA@NYJ": "Zach's point, and Miami finally has a win. Malik Willis went 14-of-21 for 208 with two touchdowns, ran one in before halftime and converted fourth-and-one to seal it; both scores went to rookie Caleb Douglas, the second a 63-yard catch-and-run with 4:44 left. Ollie Gordon II carried 25 times for 103. Anthony's Jets got 287 yards and three touchdowns from Geno Smith and two scores from Mason Taylor, but had two two-point conversions wiped out by penalties. It is Jeff Hafley's first win as a head coach, and the Jets are 0-8 against the division under Aaron Glenn.",
  "7:NE@CHI": "Mark's point, and Harrison's second loss to him in five days. Caleb Williams went 22-of-33 for 308 and two touchdowns in his second game back from the hamstring, becoming the first Bears quarterback with 300 yards in back-to-back games since Mitch Trubisky in 2018. Luther Burden III caught four for 130 and a 24-yard screen touchdown, all of it before halftime. Chicago never trailed. The swing was an interception in the end zone with 3:32 left in the half \u2014 D'Marco Jackson picked off Drake Maye and the Bears went 80 yards the other way. Maye threw for 321 and two scores of his own behind New England's tenth different offensive line of the season, with two third-string guards starting. Cairo Santos ended it from 58 on fourth-and-fifteen with 1:34 left, a career long that ties the franchise record. Chicago is 5-2 and lost Cole Kmet to a knee injury reported as season-ending; New England is 4-3 with its three-game run over.",
  "7:NYG@HOU": "Bill's third point of the day, in overtime. J.J. McCarthy made his first start for the Giants \u2014 20-of-28 for 252 with no turnovers and five completions of twenty or more \u2014 after John Harbaugh benched Jameis Winston. Cam Skattebo ran for 124 including a 42-yarder in the extra period, and Devin Singletary won it from 30. Harrison's Texans gained 237 yards, went 3-of-12 on third down, and held Nico Collins to two catches for six. New York is 4-2-1.",
  "7:PIT@NO": "Jon's only point of the week, in the first NFL regular-season game played in France. Aaron Rodgers went 19-of-30 for 212, Jaylen Warren ran for 101, and a 51-yard DK Metcalf catch set up the game's only touchdown, a four-yarder to Darnell Washington. Chris Boswell did the rest. Brian's Saints ran fourteen times for eleven yards \u2014 Tyler Shough was their leading rusher with seven \u2014 and Payton Wilson intercepted him in the red zone to open the second half. Pittsburgh is 5-2 and alone atop the AFC North.",
  "7:SF@ATL": "Brian's point and the end of San Francisco's unbeaten run. Mark's 49ers led 14-3 and gave up 23 straight. They outgained Atlanta 400 to 295 and lost by nine because they turned it over four times to none \u2014 Jessie Bates intercepted Brock Purdy on a throwaway that was not quite a throwaway, Kendal Daniels tipped a third-down pass to himself, and George Kittle fumbled it away at the end. Michael Penix Jr. went 25-of-34 for 213 with three touchdowns and no interceptions, to Nick Muse, Kyle Pitts and Drake London. San Francisco was without Nick Bosa, Mike Evans and Deebo Samuel; Christian McCaffrey scored, left with a thigh and came back. Atlanta is 3-4, the Niners 6-1.",
  "7:TB@CAR": "Bill's point, and a demolition. Tampa Bay won 43-13 on 258 rushing yards, the second-most any team has put up this season \u2014 Bucky Irving went 24 for 106 and two scores, Sean Tucker added a 46-yarder. Baker Mayfield came back from the dislocated thumb and threw eleven passes. The rest was special teams and defense: a blocked field goal returned for a touchdown, a strip-sack returned for another, and Tykee Smith with an interception and a blocked extra point. Patrick's Panthers were sacked five times and Bryce Young threw two picks."

  /* Fireworks. Shells launch from the bottom of the story section, burst, and
     the sparks fall with a little drag. Runs for a fixed stretch and then stops
     for good — a standings page that animates forever is a standings page
     nobody leaves open. Skipped entirely under prefers-reduced-motion, and it
     never throws if the canvas is missing. */
  function fireworks() {
    var cv = document.getElementById("fx");
    if (!cv || !cv.getContext) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var ctx = cv.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;
    function size() {
      var r = cv.getBoundingClientRect();
      W = r.width; H = r.height;
      cv.width = Math.max(1, Math.round(W * dpr));
      cv.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener("resize", size);

    // Titans two-tone plus the league blue, so it reads as this week's colours
    // rather than generic confetti.
    // No additive blending and no white: the page ground is pale, so "lighter"
    // washes every spark out toward the paper colour. Plain source-over keeps
    // the navy and the red readable.
    var HUES = ["#1F6FB8", "#0C2340", "#C8102E", "#D9A520", "#0B8A3E"];
    var shells = [], sparks = [], t0 = performance.now(), RUN = 11000, raf = 0;

    function launch() {
      shells.push({
        x: W * (0.12 + Math.random() * 0.76),
        y: H,
        vy: -(3.4 + Math.random() * 1.5),
        fuse: 36 + Math.random() * 26,
        c: HUES[(Math.random() * HUES.length) | 0]
      });
    }

    function burst(s) {
      var n = 52 + ((Math.random() * 24) | 0);
      for (var i = 0; i < n; i++) {
        var a = (Math.PI * 2 * i) / n + Math.random() * 0.2;
        var sp = 1.1 + Math.random() * 3.1;
        sparks.push({
          x: s.x, y: s.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 54 + Math.random() * 36, age: 0, c: s.c
        });
      }
    }

    // Open with a volley so the page is already celebrating when it lands,
    // rather than making anyone wait for the first shell.
    launch(); launch(); launch();
    var since = 0;
    function frame(now) {
      var done = now - t0 > RUN;
      ctx.clearRect(0, 0, W, H);

      if (!done && --since <= 0) { launch(); since = 9 + ((Math.random() * 12) | 0); }


      for (var i = shells.length - 1; i >= 0; i--) {
        var s = shells[i];
        s.x += 0.2; s.y += s.vy; s.vy += 0.035; s.fuse--;
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = s.c;

        p.vy += 0.045; p.vx *= 0.985; p.vy *= 0.985;
        p.age++;

        ctx.globalAlpha = k;
        ctx.fillStyle = p.c;

        ctx.arc(p.x, p.y, 2.3 * k + 0.6, 0, Math.PI * 2);

        cv.classList.remove("lit");
        cancelAnimationFrame(raf);
        return;
      }

    }

    cv.classList.add("lit");
    raf = requestAnimationFrame(frame);
  }

  if (OWNERS.indexOf(ME) === -1) ME = null;

  // Cumulative points per owner, week 0 to now — feeds the heat check,

  var cum = {};

  // back one, or every arrow silently disappears the moment a week closes.
  var baseWeek = (played > TW) ? TW : TW - 1;

      .forEach(function (r, i) {

  // Heat check — last completed week against the league average for that week.
  // Every game awards exactly one point somewhere, so the eight owners always
  // split the week's games between them: the average is the honest break-even,
  // and it self-corrects for bye weeks without any special casing.
  // Heat check uses the week currently being played — the same week as the
  // "+N in Wx" figure beside it — so the row never shows two different weeks.
  // Mid-week the average simply reflects the games decided so far.
  var heat = {}, HW = played;

  var slate = {};

  function weekChip(owner) {
    var s = slate[owner];

    var tail = [];
    if (left) tail.push(left + " to play");
    if (byes > 0) tail.push(byes === 1 ? "bye" : byes + " byes");
    if (!tail.length) tail.push("W" + HW);

    // A sweep or a blank is only a sweep or a blank once the week has finished.
    var settled = !left;
    var chip = el("span", "wk" + (settled && s.done && got === s.done ? " sweep"

    chip.appendChild(el("b", null, pts(got) + "/" + s.done));
    chip.appendChild(document.createTextNode(" · " + tail.join(" · ")));
    chip.title = "Week " + HW + ": " + pts(got) + " point" + (got === 1 ? "" : "s") +

                 (left ? ", " + left + " still to play" : "") +

  var host = document.getElementById("standings");

  function renderStandings() {

  /* ---------------- results, then what's next ---------------- */
  (function () {
    var games = (D.games || []).slice();
    if (!games.length) return;

    var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function kickLabel(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/.exec(s || "");
      if (!m) return s || "TBD";
      var dt = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      var h = +m[4], ap = h >= 12 ? "PM" : "AM";

    function gameRow(g, showWeek) {
      var mine = ownerOf[g.home] === ownerOf[g.away];
      var winner = g.done ? (g.hs > g.as ? g.home : g.as > g.hs ? g.away : null) : null;

      var row = el("div", "game" + (g.done ? " played" : ""));
      row.appendChild(el("div", "kick",
        g.done ? (showWeek ? "W" + g.wk + " · Final" : "Final") : kickLabel(g.kick)));

      var vs = el("div", "vs");
      [g.away, g.home].forEach(function (t, idx) {
        if (idx === 1) vs.appendChild(el("span", "at", "at"));
        var side = el("span", "side" + (winner === t ? " won" : g.done ? " lost" : ""));
        var dot = el("span", "dot");
        dot.style.background = COLOR[ownerOf[t]];
        side.appendChild(dot);
        side.appendChild(el("b", null, TEAM[t]));
        side.appendChild(el("em", null, ownerOf[t]));
        vs.appendChild(side);
      });
      if (mine) vs.appendChild(el("span", "tag", "Both " + ownerOf[g.home] + "'s"));
      row.appendChild(vs);

      var odds = el("div", "odds");
      if (g.done) {
        // Final score, away first to match the "X at Y" reading above.
        odds.appendChild(el("b", "score", g.as + "–" + g.hs));
        odds.appendChild(el("span", null,
          winner ? ownerOf[winner] + " +1" : "Tie · both +0.5"));
      } else {
        // spread is quoted from the home team's side: positive means home is favoured.
        if (typeof g.spread === "number") {
          var favTeam = g.spread > 0 ? g.home : g.away;
          var margin = Math.abs(g.spread);
          odds.appendChild(el("b", null,
            margin === 0 ? "Pick 'em" : favTeam + " −" + (margin % 1 ? margin.toFixed(1) : margin)));
        } else {
          odds.appendChild(el("b", null, "No line"));
        }
        if (typeof g.total === "number") {
          odds.appendChild(el("span", null, "O/U " + (g.total % 1 ? g.total.toFixed(1) : g.total)));
        }
      }
      row.appendChild(odds);

      var b = blurbFor(g);
      if (b) row.appendChild(el("p", "story", b));
      return row;
    }

    // ---- played: newest first, so the freshest result is at the top ----
    var done = games.filter(function (g) { return g.done; })
      .sort(function (a, b) { return String(b.kick).localeCompare(String(a.kick)); });

    if (done.length) {
      document.getElementById("results-sec").hidden = false;
      var wks = {};
      done.forEach(function (g) { wks[g.wk] = 1; });
      var wkList = Object.keys(wks).sort();
      var multi = wkList.length > 1;
      document.getElementById("results-note").textContent =
        (multi ? "Weeks " + wkList[0] + "–" + wkList[wkList.length - 1] : "Week " + wkList[0]) +
        " · " + done.length + (done.length === 1 ? " game" : " games") + " · newest first";
      var rHost = document.getElementById("results");
      done.forEach(function (g) { rHost.appendChild(gameRow(g, multi)); });
    }

    // ---- still to play ----
    var todo = games.filter(function (g) { return !g.done; })
      .sort(function (a, b) { return String(a.kick).localeCompare(String(b.kick)); });

    // ---- on the clock ----
    // Unplayed games lifted to the top of the page with what each one is
    // actually worth. Written from the live table so it cannot drift out of
    // step with the standings the way hand-written text does.
    //
    // Two modes. Mid-week it is a countdown: the games still outstanding.
    // Once a week closes and the next one has not started, fourteen fixtures
    // is not a headline, so it picks the ones that matter — Thursday always,
    // then by how much is riding on them.
    if (todo.length) {
      var oc = document.getElementById("onclock");
      oc.hidden = false;
      var started = (D.curPlayed || 0) > 0, picks;

      if (started) {
        document.getElementById("oc-label").textContent =
          todo.length === 1 ? "One game left in Week " + todo[0].wk
                            : todo.length + " games left in Week " + todo[0].wk;
        picks = todo.slice(0, 4);
      } else {
        document.getElementById("oc-label").textContent =
          "Week " + todo[0].wk + " · the ones that matter";
        var rankOf = {};
        table.forEach(function (r, i) { rankOf[r.owner] = i + 1; });
        var opener = todo[0];
        var ranked = todo.filter(function (g) { return g !== opener; })
          .map(function (g) {
            var a = ownerOf[g.away], h = ownerOf[g.home], s = 16 - (rankOf[a] + rankOf[h]);
            if (a === h) s += 3;                                       // a banked point is news
            if (a === table[0].owner || h === table[0].owner) s += 4;  // so is the leader
            if (/\s(2[0-3]):/.test(g.kick || "")) s += 3;              // and so is primetime
            return { g: g, s: s };
          })
          .sort(function (p, q) {
            return q.s - p.s || String(p.g.kick).localeCompare(String(q.g.kick));
          });

        // The leader is in every high-scoring game, which would hand back four
        // rows about one owner. Two appearances each keeps it a week preview
        // rather than a Mark preview.
        var seen = {};
        function take(g) {
          var a = ownerOf[g.away], h = ownerOf[g.home];
          seen[a] = (seen[a] || 0) + 1;
          if (h !== a) seen[h] = (seen[h] || 0) + 1;
        }
        function room(g) {
          var a = ownerOf[g.away], h = ownerOf[g.home];
          return (seen[a] || 0) < 2 && (seen[h] || 0) < 2;
        }
        picks = [opener];
        take(opener);
        ranked.forEach(function (x) {
          if (picks.length < 4 && room(x.g)) { picks.push(x.g); take(x.g); }
        });
      }

      var ocBody = document.getElementById("oc-body");
      picks.forEach(function (g) {
        var row = el("div", "oc-game");
        [[g.away, "away"], [g.home, "home"]].forEach(function (pair, i) {
          if (i) row.appendChild(el("span", "oc-at", "at"));
          var o = ownerOf[pair[0]];
          var side = el("span", "oc-side");
          var dot = el("span", "dot");
          dot.style.background = COLOR[o];
          side.appendChild(dot);
          side.appendChild(el("b", null, pair[0]));
          side.appendChild(el("em", null, o));
          row.appendChild(side);
        });
        row.appendChild(el("span", "oc-when", kickLabel(g.kick)));

        // A game between two of the same owner's teams pays him either way —
        // true no matter what else happens, so it is worth saying whenever.
        var ha = ownerOf[g.away], hh = ownerOf[g.home];
        if (ha === hh) {
          row.appendChild(el("p", "oc-stake",
            ha + " owns both sides — the point is banked either way."));
        } else if (todo.length === 1) {
          // "X wins and is N back" is only honest when this is the last game
          // standing. With a full slate still to play, every other result
          // moves the same numbers, so the line would be quietly wrong.
          var lead = table[0];
          var bits = [ha, hh].map(function (o) {
            var after = D.points[o] + 1, gap = lead.p - after;
            if (o === lead.owner) {
              return o + " wins and stretches it to " + pts(after - table[1].p);
            }
            return o + " wins and is " + (gap <= 0 ? "level with" : pts(gap) + " back of") +
                   " " + lead.owner;
          });
          row.appendChild(el("p", "oc-stake", bits.join(" · ") + "."));
        }
        ocBody.appendChild(row);
      });

      document.getElementById("upnext-sec").hidden = false;
      document.getElementById("upnext-title").textContent =
        "Week " + todo[0].wk + " — still to play";
      var uHost = document.getElementById("upnext");
      todo.forEach(function (g) { uHost.appendChild(gameRow(g, false)); });

      // A game between two of the same owner's teams is a point banked
      // whoever wins — worth calling out while it is still ahead of us.
      var locks = todo.filter(function (g) { return ownerOf[g.home] === ownerOf[g.away]; });
      var note = document.getElementById("slate-note");
      if (locks.length) {
        var byOwner = {};
        locks.forEach(function (g) {
          var o = ownerOf[g.home];
          (byOwner[o] = byOwner[o] || []).push(TEAM[g.away] + "–" + TEAM[g.home]);
        });
        note.textContent = "Every franchise is drafted, so most games are owner against owner — but " +
          Object.keys(byOwner).map(function (o) {
            return o + " owns both sides of " + byOwner[o].join(" and ");
          }).join(", and ") + " — " +
          (locks.length === 1 ? "one point" : locks.length + " points") +
          " banked, and not a single bragging right earned.";
      } else {
        note.textContent = "Every franchise is drafted, so every game left this week is one owner against another. Pick your enemies accordingly.";
      }
    }

    /* Which section leads depends on when you're reading, not on when this
       page was last built. Sunday through Wednesday the scores are the news;
       by Thursday everyone has moved on to the next slate. The viewer's own
       clock decides, so the order stays right between refreshes. */
    function etToDate(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/.exec(s || "");
      if (!m) return null;
      var mo = +m[2];
      var off = (mo >= 3 && mo <= 10) ? 4 : 5;   // ET offset, near enough
      return new Date(Date.UTC(+m[1], mo - 1, +m[3], +m[4] + off, +m[5]));
    }

    var lastEnd = null;
    done.forEach(function (g) {
      var d = etToDate(g.kick);
      if (!d) return;
      d = new Date(d.getTime() + 3.4 * 3600 * 1000);   // roughly when it ended
      if (!lastEnd || d > lastEnd) lastEnd = d;
    });

    var FRESH = 48 * 3600 * 1000;
    var resultsLead = !!lastEnd && (Date.now() - lastEnd.getTime()) < FRESH;

    var resSec = document.getElementById("results-sec");
    var upSec = document.getElementById("upnext-sec");
    if (!resultsLead && done.length && todo.length) {
      resSec.parentNode.insertBefore(upSec, resSec);
      document.getElementById("results-note").textContent += " · final";
    }
  })();

  document.getElementById("foot").textContent =
    "Eight owners, four teams each, all thirty-two franchises spoken for. One point per win, " +
    "half for a tie, regular season only. No trades, no waivers, nobody to blame but the guys you drafted. " +
    "Records computed from finished " + D.season + " regular-season games (nflverse play-by-play schedule data), " +
    "checked against league totals before publishing: " + D.checks.wins + " wins, " +
    D.checks.losses + " losses, " + D.checks.ties + " ties across " + D.checks.teams +
    " teams. Point spreads and totals come from the same dataset's closing market lines. " +
    (D.refreshNote || "Refreshed on request through the season") + "; playoff games do not count.";
})();
</script>

</body>
</html>
